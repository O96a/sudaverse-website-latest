name: Publish site

# Builds the site and deploys it to GitHub Pages with GitHub Actions. The footer year comes from the build date,
# so the monthly schedule (the 1st of every month, which includes 1 January) rolls it over with no manual step.
#
# One-time setup, as the repository owner:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Settings > Secrets and variables > Actions > Variables: DEPLOY_MODE = actions
# Until DEPLOY_MODE is set this workflow does nothing (its jobs are skipped).
#
# Optional public build settings, also as repository VARIABLES (they end up in the public site anyway):
#   PUBLIC_CONTACT_ENDPOINT  https://<relay-host>/contact  (see site/relay)
#   PUBLIC_WHATSAPP_NUMBER, PUBLIC_SIGNAL_NUMBER (or PUBLIC_SIGNAL_URL), PUBLIC_TELEGRAM_HANDLE
#
# Nothing is committed back to the repository: the built site is never stored in git by this workflow.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/publish.yml']
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
  PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER }}
  PUBLIC_SIGNAL_NUMBER: ${{ vars.PUBLIC_SIGNAL_NUMBER }}
  PUBLIC_SIGNAL_URL: ${{ vars.PUBLIC_SIGNAL_URL }}
  PUBLIC_TELEGRAM_HANDLE: ${{ vars.PUBLIC_TELEGRAM_HANDLE }}

jobs:
  build:
    name: Build
    if: vars.DEPLOY_MODE == 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Tells us the URL prefix GitHub will serve the site under: empty on the custom domain
      # (www.sudaverse.com), or /repo-name on a project page. The build follows it, so links and assets never break.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - run: npm run test:integrity
      - run: npm run test:links
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
